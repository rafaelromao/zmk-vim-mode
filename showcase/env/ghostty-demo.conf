# Ghostty configuration for the showcase recording.
# Start with:
#   ghostty --gtk-single-instance=false --config-file=$PWD/showcase/env/ghostty-demo.conf \
#     --working-directory=$PWD/showcase/demo-go \
#     -e /bin/bash --noprofile --rcfile $PWD/showcase/env/demo.bashrc -i
# (a second Ghostty instance, so your everyday windows keep their own config; the rehearsal
# opens exactly this, see rehearse.py)

theme = TokyoNight
background-opacity = 1

font-family = "Hack Nerd Font Mono"
font-size = 20

window-padding-x = 18
window-padding-y = 18
window-theme = ghostty
window-decoration = true
# no forced title: the shell sets it to the directory and nvim to its own, which the
# daemon's title heuristic and the recording rely on
confirm-close-surface = false
resize-overlay = never

cursor-style = block
cursor-style-blink = false
shell-integration-features = no-cursor

# The demo shell is Bash with env/demo.bashrc (isolated prompt and history), passed on the
# command line above rather than set here: the rcfile needs an absolute path.
