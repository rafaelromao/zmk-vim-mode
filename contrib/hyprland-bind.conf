# Hyprland bindings for zmk-vim-mode.
# Source from hyprland.conf:  source = ~/projects/zmk-vim-mode/contrib/hyprland-bind.conf
#
# The daemon starts from the systemd user service; nothing needs to run here.
# These bindings exist so the *keyboard* can tell the host when you override
# vim mode by hand, and so you can override it from the host for cases the
# daemon cannot detect (an SSH session, a screen-sharing app, a game).
#
# `set` toggles: issuing the same mode twice returns to automatic decisions.
# --sticky keeps the override across application switches; without it the
# override is dropped as soon as the frontmost window changes.

# ---------------------------------------------------------------------------
# Keyboard-initiated toggles
# ---------------------------------------------------------------------------
# The keymap's vim-mode macros already announce themselves to the host:
#
#   entering (vim_reset_notify) sends  &kp LG(LC(LA(LS(ESC))))  = Hyper+Esc
#   leaving  (vim_mode_off)     sends  &kp LC(LA(LS(ESC)))      = Meh+Esc
#
# Without these binds the keyboard and the daemon disagree after a combo: the
# keyboard switches layers locally, the daemon never learns, and its next
# decision change quietly overrides you.
#
# Entering maps to `legacy` rather than `normal` on purpose. Code 4 runs the
# keymap's own &vim_mode_on, which is idempotent (a layer-morph resolving to
# &none when a vim layer is already active), so nothing is re-triggered and no
# second Esc is injected. It also matches the semantics: you are telling the
# host "the keyboard is driving now, infer modes locally".

# Hyper+Esc — keyboard entered vim mode. Press again to hand control back.
bind = SUPER CTRL ALT SHIFT, ESCAPE, exec, zmk-vim-mode set legacy --sticky

# Meh+Esc — keyboard left vim mode. Press again to hand control back.
bind = CTRL ALT SHIFT, ESCAPE, exec, zmk-vim-mode set off --sticky

# ---------------------------------------------------------------------------
# Host-initiated overrides (optional)
# ---------------------------------------------------------------------------
# Force raw: no vim layers at all, every key passes through untouched.
bind = SUPER SHIFT, R, exec, zmk-vim-mode set raw

# Back to automatic decisions, whatever the current override is.
bind = SUPER SHIFT, A, exec, zmk-vim-mode set auto

# ---------------------------------------------------------------------------
# Retiring the old watcher
# ---------------------------------------------------------------------------
# Remove these two lines from hyprland.conf and disable the unit:
#   exec-once = systemctl --user enable ~/.config/hypr/zmk-vim-mode-watcher.service
#   exec-once = systemctl --user start zmk-vim-mode-watcher.service
#   systemctl --user disable --now zmk-vim-mode-watcher
