# Optional Hyprland bindings for zmk-vim-mode.
# Source from hyprland.conf:  source = ~/projects/zmk-vim-mode/contrib/hyprland-bind.conf
#
# The daemon starts from the systemd user service; nothing needs to run here.
# These are manual overrides for cases the daemon cannot detect on its own
# (an SSH session, a screen-sharing app, a game).
#
# `set` toggles: issuing the same mode twice returns to automatic decisions.

# Force the keyboard's legacy vim mode (keyboard infers modes locally).
bind = SUPER SHIFT, V, exec, zmk-vim-mode set legacy

# Force raw: no vim layers at all, keys pass through untouched.
bind = SUPER SHIFT, R, exec, zmk-vim-mode set raw

# Back to automatic.
bind = SUPER SHIFT, A, exec, zmk-vim-mode set auto

# Retire the old watcher when adopting this daemon: remove these two lines
# from hyprland.conf, and `systemctl --user disable --now zmk-vim-mode-watcher`.
#   exec-once = systemctl --user enable ~/.config/hypr/zmk-vim-mode-watcher.service
#   exec-once = systemctl --user start zmk-vim-mode-watcher.service
