# Hyprland bindings for zmk-vim-mode.
# Source from hyprland.conf:  source = ~/projects/zmk-vim-mode/contrib/hyprland-bind.conf
#
# The daemon starts from the systemd user service; nothing needs to run here.
# These bindings exist so the *keyboard* can tell the host when you enter or
# leave vim mode by hand, and so you can override it from the host for cases
# the daemon cannot detect (an SSH session, a screen-sharing app, a game).
#
# A plain `set` toggles: issuing the same mode twice returns to automatic
# decisions. --sticky keeps the override across application switches; without
# it the override is dropped as soon as the frontmost window changes.
#
# On macOS the ZmkVimMode Spoon (bars/hammerspoon) binds the same two chords.

# ---------------------------------------------------------------------------
# Keyboard notifications
# ---------------------------------------------------------------------------
# The keymap announces manual changes to the host:
#
#   entering (vim_reset_notify) sends  &kp LG(LC(LA(LS(ESC))))  = Hyper+Esc
#   leaving  (vim_mode_off, and cancel while vim mode is on)
#                               sends  &kp LC(LA(LS(ESC)))      = Meh+Esc
#
# Without these binds the keyboard and the daemon disagree after a combo: the
# keyboard switches layers locally, the daemon never learns, and its next
# decision change quietly overrides you.
#
# Entering maps to `legacy` rather than `normal` on purpose: it tells the host
# "a vim-like editor is focused, infer the mode on the keyboard". Leaving maps
# to `auto`: it drops the manual override and lets the daemon decide again.
#
# Neither toggles. The keyboard only ever announces a state it is in, so a
# repeated chord must confirm that state, never flip it: --no-toggle keeps an
# override already in legacy, and `auto` is a no-op when there is none. That
# is what lets cancel send Meh+Esc every time it leaves vim mode.
#
# For this to be safe, code 4 in the keymap must not re-emit Hyper+Esc. See
# vim_mode_on_host in the keyboards repo's zmk/features/vim.dtsi: the module
# clears managed layers before running a code's bindings, so the layer-morph
# guard in &vim_mode_on cannot protect against that and a plain &kp ESC is used.

# Hyper+Esc — vim mode entered by hand on the keyboard.
bind = SUPER CTRL ALT SHIFT, ESCAPE, exec, zmk-vim-mode set legacy --sticky --no-toggle

# Meh+Esc — vim mode left by hand on the keyboard (cancel included).
bind = CTRL ALT SHIFT, ESCAPE, exec, zmk-vim-mode set auto

# ---------------------------------------------------------------------------
# Host-initiated overrides (optional)
# ---------------------------------------------------------------------------
# Force raw: no vim layers at all, every key passes through untouched. Press
# again to hand control back.
bind = SUPER SHIFT, R, exec, zmk-vim-mode set raw

# Back to automatic decisions, whatever the current override is.
bind = SUPER SHIFT, A, exec, zmk-vim-mode set auto
