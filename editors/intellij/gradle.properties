# Adjust these to your machine, then: gradle buildPlugin
#
# platformPath  the IDE to build against (used from disk, never downloaded)
# ideaVimPath   the installed IdeaVim plugin directory, likewise
# sinceBuild    the build number of that IDE (Help -> About -> Build #IU-...)
#
# Both paths may contain spaces; do not quote them.

platformPath=/Applications/IntelliJ IDEA.app
ideaVimPath=/Users/rromao/Library/Application Support/JetBrains/IntelliJIdea2026.2/plugins/IdeaVim
sinceBuild=262

# The platform plugin asks for the JDK the target IDE runs on -- 25 for
# IntelliJ 2026.2 -- which you probably do not have installed. The IDE ships
# exactly that JVM, so point Gradle's toolchain detection at it instead of
# installing another JDK or letting Gradle download one.
org.gradle.java.installations.paths=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
