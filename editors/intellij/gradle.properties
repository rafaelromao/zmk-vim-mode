# Adjust these three to your machine, then: ./gradlew buildPlugin
#
# platformPath    the IDE to build against (no download, no network for it)
# ideaVimVersion  the IdeaVim you have installed (Settings -> Plugins -> Installed)
# sinceBuild      the build number of that IDE (Help -> About -> Build #IU-...)

platformPath=/Applications/IntelliJ IDEA.app
ideaVimVersion=2.46.2
sinceBuild=262

kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
